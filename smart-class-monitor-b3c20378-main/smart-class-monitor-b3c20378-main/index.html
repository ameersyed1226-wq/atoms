  <body>
    <div id="root"></div>
    <script>
      // Cross-origin bridge listener to sync attendance data with ckcet-student-portal
      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "REQUEST_ATTENDANCE_DATA") {
          event.source.postMessage({
            type: "SYNC_ATTENDANCE_DATA",
            students: localStorage.getItem("netcampus_students_v3"),
            attendance: localStorage.getItem("netcampus_attendance_v3"),
            periods: localStorage.getItem("netcampus_period_attendance_v1")
          }, event.origin);
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
